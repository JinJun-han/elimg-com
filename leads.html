<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>상담 접수함 | 글로컬브릿지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0a2540;--teal:#00796b;--gold:#b8892e;--bg:#f4f7f9;--line:#dde3e8;--gray:#5a6472;--red:#c0392b}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:#1a1a1a;line-height:1.65;font-size:16px}
.wrap{max-width:820px;margin:0 auto;padding:18px 14px 60px}

header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:1.25rem;font-weight:900;color:var(--navy)}
h1 small{display:block;font-size:.78rem;font-weight:400;color:var(--gray);margin-top:2px}
.reload{background:var(--navy);color:#fff;border:none;border-radius:9px;padding:11px 18px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer}
.reload:hover{background:#12395f}

.gate{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;text-align:center}
.gate p{font-size:.9rem;color:var(--gray);margin-bottom:14px}
.gate input{width:100%;max-width:320px;padding:12px 14px;border:1.5px solid var(--line);border-radius:9px;font-family:inherit;font-size:1rem;text-align:center}
.gate button{margin-top:10px;display:block;width:100%;max-width:320px;margin-left:auto;margin-right:auto;padding:12px;background:var(--teal);color:#fff;border:none;border-radius:9px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:16px}
.st{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;transition:.15s}
.st:hover{border-color:var(--teal)}
.st.on{background:var(--navy);border-color:var(--navy)}
.st.on b,.st.on span{color:#fff}
.st b{display:block;font-size:1.3rem;font-weight:900;color:var(--navy);line-height:1.2}
.st span{font-size:.72rem;color:var(--gray)}

.card{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gray);border-radius:11px;padding:15px 16px;margin-bottom:11px}
.card.new{border-left-color:var(--gold)}
.card.contacted{border-left-color:#2980b9}
.card.proposal{border-left-color:var(--teal)}
.card.won{border-left-color:#1e8449;background:#f2fbf5}
.card.lost{border-left-color:#95a5a6;opacity:.62}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:7px}
.who{font-size:1.12rem;font-weight:900;color:var(--navy)}
.who .org{font-size:.82rem;font-weight:500;color:var(--gray);margin-left:6px}
.when{font-size:.74rem;color:var(--gray);white-space:nowrap}
.kind{display:inline-block;background:var(--bg);border-radius:5px;padding:3px 9px;font-size:.76rem;color:var(--teal);font-weight:700;margin-bottom:7px}
.tel{display:inline-block;font-size:1.18rem;font-weight:900;color:var(--teal);text-decoration:none;letter-spacing:-.3px}
.msg{font-size:.87rem;color:#333;background:var(--bg);border-radius:8px;padding:9px 11px;margin:8px 0;white-space:pre-wrap;line-height:1.7}
.from{font-size:.72rem;color:var(--gray);margin-bottom:9px}
.acts{display:flex;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.acts button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-family:inherit;font-size:.82rem;font-weight:700;color:var(--gray);cursor:pointer;transition:.15s}
.acts button:hover{border-color:var(--navy);color:var(--navy)}
.acts button.act{background:var(--navy);border-color:var(--navy);color:#fff}
.acts button.del{margin-left:auto;color:var(--red);border-color:#f0c4bd}
.acts button.del:hover{background:var(--red);color:#fff;border-color:var(--red)}

.empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--gray)}
.empty b{display:block;font-size:1.05rem;color:var(--navy);margin-bottom:5px}
.err{background:#fdecea;border:1px solid #f5b7b1;color:#943126;border-radius:9px;padding:11px 14px;font-size:.86rem;margin-bottom:12px}
@media(max-width:520px){ .stats{grid-template-columns:repeat(3,1fr)} }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>📥 상담 접수함<small>거제 상담폼 · AI아카데미 진단설문 접수 내역</small></h1>
  <button class="reload" id="reloadBtn" style="display:none" onclick="load()">새로고침</button>
</header>

<div id="gate" class="gate">
  <p>관리자 키를 입력하십시오.</p>
  <input type="password" id="keyIn" placeholder="관리자 키" autocomplete="current-password">
  <button onclick="saveKey()">열기</button>
</div>

<div id="body" style="display:none">
  <div id="err"></div>
  <div class="stats" id="stats"></div>
  <div id="list"></div>
</div>

<script>
var KEY = localStorage.getItem('lead_key') || '';
var ALL = [], FILTER = '';
var LABEL = { new:'신규', contacted:'통화함', proposal:'자료발송', won:'성사', lost:'무산' };

function saveKey(){
  KEY = document.getElementById('keyIn').value.trim();
  if(!KEY) return;
  localStorage.setItem('lead_key', KEY);
  load();
}

async function load(){
  var err = document.getElementById('err'); err.innerHTML = '';
  try{
    var res = await fetch('/api/lead/list?key=' + encodeURIComponent(KEY));
    if(res.status === 401){
      localStorage.removeItem('lead_key');
      document.getElementById('gate').style.display = '';
      document.getElementById('body').style.display = 'none';
      document.getElementById('reloadBtn').style.display = 'none';
      err.innerHTML = '<div class="err">키가 맞지 않습니다.</div>';
      return;
    }
    var d = await res.json();
    ALL = d.items || [];
    document.getElementById('gate').style.display = 'none';
    document.getElementById('body').style.display = '';
    document.getElementById('reloadBtn').style.display = '';
    render();
  }catch(e){
    err.innerHTML = '<div class="err">불러오지 못했습니다: ' + e.message + '</div>';
  }
}

function render(){
  var counts = { new:0, contacted:0, proposal:0, won:0, lost:0 };
  ALL.forEach(function(x){ if(counts[x.status] !== undefined) counts[x.status]++; });

  document.getElementById('stats').innerHTML = Object.keys(LABEL).map(function(k){
    return '<div class="st ' + (FILTER===k?'on':'') + '" onclick="setFilter(\'' + k + '\')">' +
           '<b>' + counts[k] + '</b><span>' + LABEL[k] + '</span></div>';
  }).join('');

  var rows = FILTER ? ALL.filter(function(x){ return x.status === FILTER; }) : ALL;
  var list = document.getElementById('list');

  if(!rows.length){
    list.innerHTML = '<div class="empty"><b>' + (FILTER ? LABEL[FILTER] + ' 항목이 없습니다' : '아직 접수된 상담이 없습니다') + '</b>' +
      (FILTER ? '' : '전화를 걸고 자료를 보내면 이곳이 채워집니다.') + '</div>';
    return;
  }

  list.innerHTML = rows.map(function(x){
    var t = new Date(x.ts);
    var when = (t.getMonth()+1) + '월 ' + t.getDate() + '일 ' + String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
    var tel = String(x.contact||'').replace(/[^0-9+]/g,'');
    return '<div class="card ' + (x.status||'new') + '">' +
      '<div class="top"><div class="who">' + esc(x.name || '(이름 없음)') +
        (x.org ? '<span class="org">' + esc(x.org) + '</span>' : '') + '</div>' +
        '<div class="when">' + when + '</div></div>' +
      (x.kind ? '<div class="kind">' + esc(x.kind) + '</div>' : '') +
      '<div><a class="tel" href="tel:' + tel + '">📞 ' + esc(x.contact) + '</a></div>' +
      (x.message ? '<div class="msg">' + esc(x.message) + '</div>' : '') +
      (x.memo ? '<div class="msg">📝 ' + esc(x.memo) + '</div>' : '') +
      '<div class="from">유입: ' + esc(x.from || '-') + '</div>' +
      '<div class="acts">' +
        btn(x, 'contacted', '통화함') + btn(x, 'proposal', '자료발송') +
        btn(x, 'won', '성사') + btn(x, 'lost', '무산') +
        '<button onclick="memo(\'' + x.key + '\')">메모</button>' +
        '<button class="del" onclick="del(\'' + x.key + '\',\'' + esc(x.name) + '\')">삭제</button>' +
      '</div></div>';
  }).join('');
}

function btn(x, st, label){
  return '<button class="' + (x.status===st?'act':'') + '" onclick="upd(\'' + x.key + '\',\'' + st + '\')">' + label + '</button>';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function setFilter(k){ FILTER = (FILTER===k ? '' : k); render(); }

async function post(payload){
  var res = await fetch('/api/lead/update', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({ key: KEY }, payload))
  });
  return res.json();
}
async function upd(target, status){
  var o = await post({ target: target, status: status });
  if(o.ok) load(); else alert('실패: ' + (o.error||''));
}
async function memo(target){
  var cur = (ALL.find(function(x){ return x.key===target; })||{}).memo || '';
  var m = prompt('메모 (통화 내용·다음 할 일)', cur);
  if(m === null) return;
  var o = await post({ target: target, memo: m });
  if(o.ok) load(); else alert('실패: ' + (o.error||''));
}
async function del(target, name){
  if(!confirm('"' + name + '" 접수 건을 삭제합니다.\n되돌릴 수 없습니다. 진행할까요?')) return;
  var o = await post({ target: target, action: 'delete' });
  if(o.ok) load(); else alert('실패: ' + (o.error||''));
}

if(KEY) load();
</script>
</div>
</body>
</html>
